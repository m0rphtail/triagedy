[package]
name = "triagedy"
version = "0.1.0"
edition = "2024"
description = "Alert triage as a UNIX filter: JSONL alerts in, typed decisions out."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
